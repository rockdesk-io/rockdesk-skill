# Smithery configuration for RockDesk MCP
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  description: "Control remote computers by 9-digit RockDesk ID via MCP: shell, files, screenshots, mouse and keyboard on Windows, macOS, Linux and Android."
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'rockdesk-mcp']
    })
  exampleConfig: {}
