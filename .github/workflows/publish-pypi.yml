# Publishes mcp/pypi (rockdesk-mcp) to PyPI with Trusted Publishing (OIDC): no API token is stored anywhere.
# Runs when a tag like mcp-v1.0.18 is pushed, or by hand from the Actions tab.
name: Publish rockdesk-mcp to PyPI
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build mcp/pypi --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
